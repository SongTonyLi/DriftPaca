name: Set up Flutter
description: Install a pinned Flutter SDK, cache it and pub packages, then resolve dependencies.

inputs:
  flutter-version:
    description: Flutter SDK version to install
    required: false
    default: "3.47.3"

runs:
  using: composite
  steps:
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ inputs.flutter-version }}
        cache: true

    - name: Print Flutter version
      shell: bash
      run: flutter --version

    - name: Resolve Dart packages
      shell: bash
      run: flutter pub get
