name: Set up Flutter
description: Install a pinned Flutter SDK, cache it and pub packages, then resolve dependencies.

inputs:
  flutter-version:
    description: Flutter SDK version to install
    required: false
    default: "3.47.3"

runs:
  using: composite
  steps:
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ inputs.flutter-version }}
        cache: true

    - name: Print Flutter version
      shell: bash
      run: flutter --version

    - name: Resolve Dart packages
      shell: bash
      run: |
        for attempt in 1 2 3; do
          echo "::group::flutter pub get (attempt ${attempt})"
          if flutter pub get; then
            echo "::endgroup::"
            exit 0
          fi
          echo "::endgroup::"
          if [[ "${attempt}" -eq 3 ]]; then
            echo "flutter pub get failed after ${attempt} attempts"
            exit 1
          fi
          sleep $((attempt * 20))
        done
