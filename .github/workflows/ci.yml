name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Linux test libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-warnings > "${RUNNER_TEMP}/analyze.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/analyze.log"
          if ! grep -Eq 'issues found|No issues found' "${RUNNER_TEMP}/analyze.log"; then
            echo "::error::Analyzer did not finish normally (exit ${status})"
            exit "${status:-1}"
          fi
          if grep -qE '^[[:space:]]+error •' "${RUNNER_TEMP}/analyze.log"; then
            echo "::error::Analyzer reported errors"
            exit 1
          fi
          echo "No analyzer errors (warnings/infos are non-blocking; exit ${status})"

      - name: Test
        run: flutter test --exclude-tags live --reporter github --coverage

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build:
    name: Build ${{ matrix.label }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux desktop
            target: linux
            command: flutter build linux --release
          - label: Web
            target: web
            command: flutter build web --release
          - label: Android APK (debug)
            target: android
            command: flutter build apk --debug
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Linux desktop build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Enable Linux desktop
        if: matrix.target == 'linux'
        run: flutter config --enable-linux-desktop

      - name: Accept Android licenses
        if: matrix.target == 'android'
        run: yes | flutter doctor --android-licenses >/dev/null 2>&1 || true

      - name: Build
        run: ${{ matrix.command }}
